name: Council Search Index

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: council-search-index
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process council search index queue
        env:
          AUDIENCE: https://civictech-setagaya.org/api/cron/council-search-index
          ENDPOINT: https://civictech-setagaya.org/api/cron/council-search-index
        run: |
          encoded_audience="$(
            jq -rn --arg value "$AUDIENCE" '$value | @uri'
          )"
          oidc_response="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --header "Accept: application/json; api-version=2.0" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}"
          )"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"
          echo "::add-mask::$oidc_token"

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 90 \
            --header "Authorization: Bearer ${oidc_token}" \
            "$ENDPOINT"
